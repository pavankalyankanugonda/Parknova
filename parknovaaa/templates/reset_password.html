{% extends 'base.html' %}

{% block title %}Reset Password - ParkNova{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    
    <!-- Reset Password Card -->
    <div class="glass-panel p-8 rounded-3xl border shadow-xl animate-fade-in">
        <div class="text-center space-y-2 mb-8">
            <h1 class="text-2xl font-extrabold text-slate-800 dark:text-white">New Password</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Resetting password for <span class="font-semibold text-slate-700 dark:text-slate-350">{{ email }}</span></p>
        </div>
        
        <form action="{{ url_for('auth.reset_password') }}" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Password Input -->
            <div class="space-y-1.5">
                <label for="password" class="text-sm font-semibold text-slate-700 dark:text-slate-350">New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full glass-input pl-10 pr-4 py-3 rounded-xl text-sm">
                </div>
            </div>
            
            <!-- Confirm Password Input -->
            <div class="space-y-1.5">
                <label for="confirm_password" class="text-sm font-semibold text-slate-700 dark:text-slate-350">Confirm New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••"
                           class="w-full glass-input pl-10 pr-4 py-3 rounded-xl text-sm">
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/20 transition-all mt-4">
                Update Password
            </button>
        </form>
    </div>
    
</div>
{% endblock %}
