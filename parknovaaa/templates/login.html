{% extends 'base.html' %}

{% block title %}Log In - ParkNova{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    
    <!-- Login Card -->
    <div class="glass-panel p-8 rounded-3xl border shadow-xl animate-fade-in">
        <div class="text-center space-y-2 mb-8">
            <h1 class="text-2xl font-extrabold text-slate-800 dark:text-white">Welcome Back</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Log in to manage your parking passes and reservations</p>
        </div>
        
        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Email Input -->
            <div class="space-y-1.5">
                <label for="email" class="text-sm font-semibold text-slate-700 dark:text-slate-350">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="name@domain.com"
                           class="w-full glass-input pl-10 pr-4 py-3 rounded-xl text-sm">
                </div>
            </div>
            
            <!-- Password Input -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label for="password" class="text-sm font-semibold text-slate-700 dark:text-slate-350">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full glass-input pl-10 pr-4 py-3 rounded-xl text-sm">
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/20 transition-all mt-4">
                Log In
            </button>
        </form>
        
        <!-- Registration Footer -->
        <div class="text-center mt-6 pt-6 border-t border-slate-100 dark:border-slate-800">
            <p class="text-sm text-slate-550 dark:text-slate-400">
                Don't have an account? 
                <a href="{{ url_for('auth.register') }}" class="font-bold text-indigo-600 dark:text-indigo-400 hover:underline">Sign up</a>
            </p>
        </div>
    </div>
    
</div>
{% endblock %}
