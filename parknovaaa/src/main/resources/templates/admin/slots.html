<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head th:replace="~{layout :: head}"></head>
<body>
  <main th:fragment="content" class="space-y-12 animate-in fade-in slide-in-from-bottom-5 duration-700">
    <!-- Slot Management Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700">
      <div class="space-y-2">
        <h2 class="text-3xl font-black text-gray-900 dark:text-white flex items-center space-x-4">
           <i class="fas fa-th-large text-blue-600"></i>
           <span>Slot Inventory Control</span>
        </h2>
        <p class="text-gray-500 dark:text-gray-400">Add, configure, and monitor all parking nodes across levels.</p>
      </div>
      <button onclick="document.getElementById('add-slot-modal').classList.toggle('hidden')" class="mt-6 md:mt-0 bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl font-black text-sm shadow-xl shadow-blue-500/20 transition-all active:scale-95 flex items-center space-x-3 group">
         <i class="fas fa-plus group-hover:rotate-90 transition-transform"></i>
         <span>Register New Slot</span>
      </button>
    </div>

    <!-- Quick Add Form (Inline) -->
    <div id="add-slot-modal" class="hidden overflow-hidden bg-white dark:bg-gray-800 p-10 rounded-3xl shadow-2xl border-2 border-blue-500/30 animate-in slide-in-from-top-5 duration-500">
      <div class="flex justify-between items-start mb-10">
        <div>
          <h3 class="text-2xl font-black text-gray-900 dark:text-white">Node Configuration</h3>
          <p class="text-sm text-gray-500">Fill in the technical details for the new slot.</p>
        </div>
        <button onclick="document.getElementById('add-slot-modal').classList.add('hidden')" class="bg-gray-100 dark:bg-gray-700 w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-red-500 hover:text-white px-2 py-1 transition-all"><i class="fas fa-times"></i></button>
      </div>

      <form th:action="@{/admin/slots/add}" th:object="${newSlot}" method="post" class="grid grid-cols-1 md:grid-cols-4 gap-8">
        <div class="space-y-2">
           <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Slot Identification</label>
           <input type="text" th:field="*{slotNumber}" required class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl py-4 px-6 focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:text-white" placeholder="e.g. A-101">
        </div>
        <div class="space-y-2">
           <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Location / Zone</label>
           <input type="text" th:field="*{location}" required class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl py-4 px-6 focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:text-white" placeholder="e.g. Floor 1">
        </div>
        <div class="space-y-2">
           <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Hourly Rate (₹)</label>
           <input type="number" th:field="*{hourlyRate}" required class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl py-4 px-6 focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:text-white" placeholder="e.g. 50">
        </div>
        <div class="flex items-end">
           <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center space-x-2">
             <i class="fas fa-save opacity-50"></i>
             <span>Save Configuration</span>
           </button>
        </div>
      </form>
    </div>

    <!-- Slots Table -->
    <div class="overflow-x-auto rounded-[2.5rem] border-2 border-white/20 dark:border-white/10 shadow-2xl bg-white/50 dark:bg-gray-900/50 backdrop-blur-xl">
      <table class="w-full text-left">
        <thead>
          <tr class="bg-gray-100/50 dark:bg-gray-800/50 text-gray-500 dark:text-gray-400 uppercase text-[10px] font-black tracking-[0.2em] border-b border-gray-100 dark:border-gray-800">
            <th class="px-10 py-8">ID Hash</th>
            <th class="px-10 py-8">Slot Reference</th>
            <th class="px-10 py-8">Zonal Info</th>
            <th class="px-10 py-8">Economics</th>
            <th class="px-10 py-8">Node State</th>
            <th class="px-10 py-8">Operations</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
          <tr th:each="slot : ${slots}" class="hover:bg-blue-50/30 dark:hover:bg-blue-900/10 transition-all group">
            <td class="px-10 py-8">
              <span class="text-[10px] font-bold uppercase text-gray-400 opacity-60" th:text="'#' + ${slot.id}">ID</span>
            </td>
            <td class="px-10 py-8">
              <div class="flex items-center space-x-4">
                <div class="bg-white dark:bg-gray-800 w-10 h-10 rounded-xl shadow-sm flex items-center justify-center text-blue-600 border border-gray-100 dark:border-gray-700"><i class="fas fa-parking text-lg"></i></div>
                <span class="text-xl font-black text-gray-900 dark:text-white" th:text="${slot.slotNumber}">A-101</span>
              </div>
            </td>
            <td class="px-10 py-8 text-sm font-bold text-gray-500 dark:text-gray-400" th:text="${slot.location}">Floor 1</td>
            <td class="px-10 py-8 text-lg font-black text-gray-800 dark:text-white" th:text="'₹' + ${slot.hourlyRate} + '/hr'">₹50/hr</td>
            <td class="px-10 py-8">
              <span th:classappend="${slot.status.name() == 'AVAILABLE' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400' : 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-400'}" class="px-5 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest inline-flex items-center space-x-2">
                 <span th:if="${slot.status.name() == 'AVAILABLE'}" class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                 <span th:if="${slot.status.name() == 'OCCUPIED'}" class="w-2 h-2 bg-rose-500 rounded-full"></span>
                 <span th:text="${slot.status}">AVAILABLE</span>
              </span>
            </td>
            <td class="px-10 py-8">
               <div class="flex space-x-4 opacity-0 group-hover:opacity-100 transition-opacity">
                 <a th:href="@{'/admin/slots/delete/' + ${slot.id}}" 
                    onclick="return confirm('WARNING: Are you sure you want to decommission this parking node? This action is irreversible.')"
                    class="bg-rose-100 hover:bg-rose-500 text-rose-600 hover:text-white w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-md active:scale-95">
                    <i class="fas fa-trash text-xs"></i>
                 </a>
               </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
