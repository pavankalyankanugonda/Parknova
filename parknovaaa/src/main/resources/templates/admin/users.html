<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head th:replace="~{layout :: head}"></head>
<body>
  <main th:fragment="content" class="space-y-12 animate-in fade-in slide-in-from-bottom-5 duration-700">
    <!-- User Management Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 font-black text-gray-900 dark:text-white">
      <div class="space-y-2">
        <h2 class="text-3xl font-black text-gray-900 dark:text-white flex items-center space-x-4">
           <i class="fas fa-users-cog text-blue-600"></i>
           <span>User Authority Control</span>
        </h2>
        <p class="text-gray-500 dark:text-gray-400 font-medium tracking-normal capitalize">Monitoring and managing user permissions and access levels across the system.</p>
      </div>
       <div class="mt-6 md:mt-0 flex space-x-4">
        <div class="bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 p-4 rounded-2xl flex items-center space-x-4 border border-blue-200 dark:border-blue-800 shadow-sm">
           <i class="fas fa-users text-2xl opacity-50"></i>
           <div class="text-left">
             <p class="text-xs font-bold uppercase tracking-widest opacity-60">Total Users</p>
             <p class="text-xl font-bold" th:text="${#lists.size(users)}">0</p>
           </div>
        </div>
      </div>
    </div>

    <!-- Users Table -->
    <div class="overflow-x-auto rounded-[2.5rem] border-2 border-white/20 dark:border-white/10 shadow-2xl bg-white/50 dark:bg-gray-900/50 backdrop-blur-xl">
      <table class="w-full text-left">
        <thead>
          <tr class="bg-gray-100/50 dark:bg-gray-800/50 text-gray-500 dark:text-gray-400 uppercase text-[10px] font-black tracking-[0.2em] border-b border-gray-100 dark:border-gray-800">
            <th class="px-10 py-8">User ID Hash</th>
            <th class="px-10 py-8">Full Name</th>
            <th class="px-10 py-8">Auth Identity</th>
            <th class="px-10 py-8">Email / Contact</th>
            <th class="px-10 py-8">Privilege Level</th>
            <th class="px-10 py-8">Security State</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
          <tr th:each="user : ${users}" class="hover:bg-blue-50/30 dark:hover:bg-blue-900/10 transition-all group">
            <td class="px-10 py-8">
              <span class="text-[10px] font-bold uppercase text-gray-400 opacity-60" th:text="'#' + ${user.id}">ID</span>
            </td>
            <td class="px-10 py-8">
              <div class="flex items-center space-x-4">
                <div class="bg-blue-600/10 w-10 h-10 rounded-xl shadow-sm flex items-center justify-center text-blue-600 border border-blue-100 dark:border-blue-800 font-bold" th:text="${#strings.substring(user.username,0,1).toUpperCase()}">U</div>
                <span class="text-lg font-black text-gray-900 dark:text-white" th:text="${user.fullName}">John Doe</span>
              </div>
            </td>
            <td class="px-10 py-8 text-sm font-bold text-gray-500 dark:text-gray-400" th:text="${user.username}">username</td>
            <td class="px-10 py-8 text-sm font-medium text-gray-600 dark:text-gray-400" th:text="${user.email}">user@test.com</td>
            <td class="px-10 py-8">
              <span th:classappend="${user.role.name() == 'ADMIN' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-400'}" class="px-5 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest inline-flex items-center space-x-2">
                 <i th:if="${user.role.name() == 'ADMIN'}" class="fas fa-crown text-[8px] opacity-70"></i>
                 <i th:if="${user.role.name() == 'USER'}" class="fas fa-user text-[8px] opacity-70"></i>
                 <span th:text="${user.role}">USER</span>
              </span>
            </td>
            <td class="px-10 py-8">
              <span class="px-4 py-2 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center space-x-2 w-fit">
                   <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span>
                   <span>Authorized</span>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
