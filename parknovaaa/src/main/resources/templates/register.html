<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300 min-h-screen flex items-center justify-center p-6">
  <div class="glass w-full max-w-md rounded-2xl p-10 shadow-lg border border-white/20 dark:border-white/10 text-center animate-in fade-in duration-1000">
    <!-- Header Section -->
    <div class="mb-10 group">
      <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-white text-3xl mb-4 group-hover:scale-110 transition-transform duration-300 shadow-lg shadow-blue-500/30">
        <i class="fas fa-id-card"></i>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Create Account</h1>
      <p class="text-gray-500 dark:text-gray-400 mt-2">Join ParkNova's smart parking network.</p>
    </div>

    <!-- Register Form -->
    <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-6">
      <div class="text-left">
        <label for="fullName" class="block text-sm font-semibold mb-2 ml-1 text-gray-700 dark:text-gray-300 uppercase tracking-widest opacity-70">Full Name</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"><i class="fas fa-signature"></i></span>
          <input type="text" id="fullName" th:field="*{fullName}" required class="w-full bg-gray-100/50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:text-white" placeholder="Enter your full name">
        </div>
      </div>

      <div class="text-left">
        <label for="email" class="block text-sm font-semibold mb-2 ml-1 text-gray-700 dark:text-gray-300 uppercase tracking-widest opacity-70">Email Address</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" th:field="*{email}" required class="w-full bg-gray-100/50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:text-white" placeholder="Enter your email address">
        </div>
      </div>

      <div class="text-left">
        <label for="username" class="block text-sm font-semibold mb-2 ml-1 text-gray-700 dark:text-gray-300 uppercase tracking-widest opacity-70">Username</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"><i class="fas fa-user"></i></span>
          <input type="text" id="username" th:field="*{username}" required class="w-full bg-gray-100/50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:text-white" placeholder="Choose a unique username">
        </div>
      </div>

      <div class="text-left">
        <label for="password" class="block text-sm font-semibold mb-2 ml-1 text-gray-700 dark:text-gray-300 uppercase tracking-widest opacity-70">Password</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" th:field="*{password}" required class="w-full bg-gray-100/50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:text-white" placeholder="Choose a strong password">
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-300 flex items-center justify-center space-x-2">
        <span>Create My Account</span>
        <i class="fas fa-arrow-right text-xs opacity-70"></i>
      </button>
    </form>

    <div class="mt-10 border-t border-gray-200 dark:border-gray-800 pt-8 flex flex-col items-center">
      <p class="text-gray-500 dark:text-gray-400 text-sm">Already have an account?</p>
      <a th:href="@{/login}" class="mt-4 font-bold text-blue-600 hover:text-blue-700 transition-colors flex items-center space-x-2">
        <i class="fas fa-sign-in-alt text-sm"></i>
        <span>Sign In Instead</span>
      </a>
    </div>
  </div>
</body>
</html>
